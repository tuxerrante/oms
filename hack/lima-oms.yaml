# Clean Lima configuration for OMS development
vmType: "qemu"
os: "Linux"
arch: "x86_64"

# Ubuntu 24.04 LTS
images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
  arch: "x86_64"

# Resources
cpus: 4
memory: "8GiB"
disk: "60GiB"

# Mount your OMS project
mounts:
- location: "~"
  mountPoint: "/home/user/host-home"
  writable: true

# Ports and SSH
ssh:
  localPort: 60022
  loadDotSSHPubKeys: true
portForwards:
- guestPort: 8080
  hostPort: 8080
- guestPort: 6443
  hostPort: 6443

# containerd
containerd:
  system: false
  user: false

# Install Docker and Go
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    
    # Update packages
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    
    # Install Docker
    curl -fsSL https://get.docker.com | sh
    systemctl disable --now docker
    apt-get install -y uidmap dbus-user-session

    # Install Go and build tools
    apt-get update
    apt-get install -y golang-go make git

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    
    # Install Docker in rootless mode
    dockerd-rootless-setuptool.sh install || true

message: |
  Your OMS Lima environment is ready.

  Drive the local bootstrap flow from the macOS host checkout:
  ------
  make run-lima-on-macos
  make install-k0s-in-lima

  OMS_REGISTRY_USER=<github-user-or-service-account> \
  OMS_INSTALL_LOCAL=/absolute/path/to/installer-lite.tar.gz \
  make bootstrap-local-on-macos
  ------

  Notes:
  - On Homebrew-based macOS hosts, install `lima-additional-guestagents`
    before first boot so Lima can start a Linux x86_64 guest
  - make install-k0s-in-lima writes kubeconfig to ~/.kube/lima-oms.yaml on the macOS host
  - The kubeconfig uses https://127.0.0.1:6443 via Lima port forwarding
  - make bootstrap-local-on-macos uses that kubeconfig from the macOS host
  - The default Lima VM does not add a dedicated extra Ceph disk yet, so a
    clean bootstrap currently stops when Rook/Ceph needs an OSD device
  - Set OMS_REGISTRY_PASSWORD before running bootstrap-local, or enter it when prompted
  - If you install from the OMS portal instead of OMS_INSTALL_LOCAL, also set
    OMS_INSTALL_VERSION, OMS_INSTALL_HASH, and OMS_PORTAL_API_KEY
  - limactl shell lima-oms opens a shell in the VM for debugging
  ------
